<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>職業法術展示 - Diablo Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080810;
        --bg-card: #0c0c18;
        --fg: #e8e8f0;
        --muted: #6b7280;
        --border: #1a1a2e;
        --accent-mage: #9f7aea;
        --accent-warrior: #f56565;
        --accent-archer: #48bb78;
        --accent-druid: #68d391;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans TC", sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow-x: hidden;
      }

      .font-display {
        font-family: "Cinzel", serif;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      .glass {
        background: rgba(12, 12, 24, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
      }

      .skill-btn {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .skill-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transition: left 0.5s;
      }

      .skill-btn:hover::before {
        left: 100%;
      }

      .skill-btn:hover {
        transform: translateX(4px);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .class-tab {
        position: relative;
        transition: all 0.3s ease;
      }

      .class-tab.active {
        font-weight: 700;
      }

      .class-tab::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        width: 80%;
        height: 2px;
        border-radius: 2px;
        transition: transform 0.3s ease;
      }

      .class-tab.active::after {
        transform: translateX(-50%) scaleX(1);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(3deg);
        }
      }

      @keyframes pulse-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 8px currentColor);
        }
        50% {
          filter: drop-shadow(0 0 16px currentColor);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .animate-slideIn {
        animation: slideIn 0.4s ease forwards;
      }

      .skill-icon {
        animation: float 3s ease-in-out infinite;
      }

      .glow-text {
        text-shadow: 0 0 20px currentColor;
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .cast-indicator {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
      }

      .cast-ring {
        width: 120px;
        height: 120px;
        border: 2px solid;
        border-radius: 50%;
        animation: castPulse 0.5s ease-out forwards;
      }

      @keyframes castPulse {
        0% {
          transform: scale(0.5);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

      function init() {
        const container = document.getElementById("canvas-container");

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080810, 0.02);

        camera = new THREE.PerspectiveCamera(

        );

        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x080810, 1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        container.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);

        controls.dampingFactor = 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 35;
        controls.maxPolarAngle = Math.PI / 2.1;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404050, 0.4);

        createGround();
        createBackgroundElements();

        window.addEventListener("resize", onWindowResize);
        animate();

      function createGround() {
        // Ground
        const groundGeo = new THREE.CircleGeometry(25, 64);
        const groundMat = new THREE.MeshStandardMaterial({
          color: 0x0a0a14,
          roughness: 0.9,
          metalness: 0.1,
          transparent: true,
          opacity: 0.95,
        });
        groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.position.y = -0.01;
        scene.add(groundMesh);

        // Hex grid pattern
        gridHelper = new THREE.GridHelper(50, 50, 0x1a1a2e, 0x0f0f1a);
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.4;
        scene.add(gridHelper);

        // Center rune circle
        const runeGeo = new THREE.RingGeometry(1.5, 1.7, 6);
        const runeMat = new THREE.MeshBasicMaterial({
          color: 0x2a2a4a,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide,
        });
        const rune = new THREE.Mesh(runeGeo, runeMat);
        rune.rotation.x = -Math.PI / 2;
        rune.position.y = 0.02;
        scene.add(rune);
      }

      function createBackgroundElements() {
        // Floating particles
        const particleCount = 300;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
          positions[i] = (Math.random() - 0.5) * 60;
          positions[i + 1] = Math.random() * 25;
          positions[i + 2] = (Math.random() - 0.5) * 60;
        }

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );

        const material = new THREE.PointsMaterial({
          color: 0x3a3a5a,
          size: 0.08,
          transparent: true,
          opacity: 0.6,
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

      // ==================== SPELL EFFECTS ====================

      // Base Spell Class
      class SpellEffect {
        constructor(config) {
          this.objects = [];
          this.age = 0;
          this.maxAge = config.duration || 3;
          this.config = config;
        }

        add(obj) {
          this.objects.push(obj);
          scene.add(obj);
        }

        update(delta) {
          this.age += delta;
          return this.age < this.maxAge;
        }

        dispose() {
          this.objects.forEach((obj) => {
            scene.remove(obj);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (Array.isArray(obj.material)) {
                obj.material.forEach((m) => m.dispose());
              } else {
                obj.material.dispose();
              }
            }
          });
        }
      }

      // ==================== MAGE SPELLS ====================

      class FireballSpell extends SpellEffect {
        constructor() {
          super({ duration: 2.5 });

          // Main fireball
          const ballGeo = new THREE.SphereGeometry(0.6, 32, 32);
          const ballMat = new THREE.MeshBasicMaterial({
            color: 0xff4400,
            transparent: true,
            opacity: 0.9,
          });
          this.ball = new THREE.Mesh(ballGeo, ballMat);
          this.ball.position.set(-10, 2, 0);
          this.add(this.ball);

          // Inner core (brighter)
          const coreGeo = new THREE.SphereGeometry(0.35, 16, 16);
          const coreMat = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            transparent: true,
            opacity: 1,
          });
          this.core = new THREE.Mesh(coreGeo, coreMat);
          this.ball.add(this.core);

          // Fire trail particles
          this.trailParticles = [];
          for (let i = 0; i < 150; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.1 + Math.random() * 0.15,
              6,
              6,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color().setHSL(
                0.05 + Math.random() * 0.05,
                1,
                0.5 + Math.random() * 0.3,
              ),
              transparent: true,
              opacity: 0.8,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            particle.userData = {
              offset: new THREE.Vector3(
                (Math.random() - 0.5) * 1.5,
                (Math.random() - 0.5) * 1.5,
                (Math.random() - 0.5) * 1.5,
              ),
              life: Math.random() * 0.5,
              maxLife: 0.5 + Math.random() * 0.3,
            };
            this.add(particle);
            this.trailParticles.push(particle);
          }

          // Point light
          this.light = new THREE.PointLight(0xff4400, 3, 15);
          this.ball.add(this.light);

            this.startPos,
            this.targetPos,

          this.ball.rotation.x += delta * 3;
          this.ball.rotation.y += delta * 2;

            p.scale.setScalar((1 - lifeRatio) * 1.5);

              p.userData.velocity.y -= delta * 15;

      class ChainLightningSpell extends SpellEffect {
        constructor() {
          super({ duration: 2 });

          this.targets = [
            new THREE.Vector3(0, 1.5, 0),
            new THREE.Vector3(6, 1.5, 3),
            new THREE.Vector3(-5, 1.5, 4),
            new THREE.Vector3(3, 1.5, -5),
          ];

          this.bolts = [];
          this.currentTarget = 0;
          this.lastCast = 0;
          this.castDelay = 0.35;
        }

        update(delta) {
          super.update(delta);

          // Cast to each target
          if (
            this.age - this.lastCast > this.castDelay &&
            this.currentTarget < this.targets.length
          ) {
            this.createBolt(this.targets[this.currentTarget]);
            this.currentTarget++;
            this.lastCast = this.age;
          }

          // Animate bolts
          this.bolts.forEach((bolt) => {
            if (bolt.line) {
              bolt.line.material.opacity *= 0.92;
            }
            if (bolt.glow) {
              bolt.glow.material.opacity *= 0.9;
            }
            if (bolt.impact) {
              bolt.impact.scale.multiplyScalar(1.05);
              bolt.impact.material.opacity *= 0.9;
            }
          });

          return this.age < this.maxAge;
        }

        createBolt(target) {
          const origin =
            this.currentTarget === 0
              ? new THREE.Vector3(0, 3, 0)
              : this.targets[this.currentTarget - 1];

          // Create jagged line
          const points = [origin.clone()];
          const segments = 20;

          for (let i = 1; i < segments; i++) {
            const t = i / segments;
            const point = new THREE.Vector3().lerpVectors(origin, target, t);
            point.x += (Math.random() - 0.5) * 1.5;
            point.y += (Math.random() - 0.5) * 1.5;
            point.z += (Math.random() - 0.5) * 1.5;
            points.push(point);
          }
          points.push(target.clone());

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0x88ddff,
            transparent: true,
            opacity: 1,
          });
          const line = new THREE.Line(geometry, material);
          this.add(line);

          // Glow effect (thicker line behind)
          const glowMat = new THREE.LineBasicMaterial({
            color: 0x44aaff,
            transparent: true,
            opacity: 0.5,
            linewidth: 3,
          });
          const glow = new THREE.Line(geometry.clone(), glowMat);
          this.add(glow);

          // Impact sphere
          const impactGeo = new THREE.SphereGeometry(0.3, 16, 16);
          const impactMat = new THREE.MeshBasicMaterial({
            color: 0x88ddff,
            transparent: true,
            opacity: 1,
          });
          const impact = new THREE.Mesh(impactGeo, impactMat);
          impact.position.copy(target);
          this.add(impact);

          // Light at impact
          const light = new THREE.PointLight(0x88ddff, 3, 8);
          light.position.copy(target);
          this.add(light);

          this.bolts.push({ line, glow, impact, light });
        }
      }

            );
            particle.userData = {

              speed: 1 + Math.random() * 2,
              phase: Math.random() * Math.PI * 2,
            };
            this.add(particle);
            this.particles.push(particle);
          }

          // Rising rings
          this.rings = [];
          for (let i = 0; i < 4; i++) {
            const ringGeo = new THREE.TorusGeometry(1.5 + i * 0.3, 0.08, 8, 32);
            const ringMat = new THREE.MeshBasicMaterial({
              color: 0x44ff88,
              transparent: true,
              opacity: 0.6,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = -1;
            ring.userData = { delay: i * 0.2, baseY: -1 };
            this.add(ring);
            this.rings.push(ring);
          }

          // Center glow
          const glowGeo = new THREE.CircleGeometry(2, 32);
          const glowMat = new THREE.MeshBasicMaterial({
            color: 0x22ff66,
            transparent: true,
            opacity: 0.3,
          });

          this.centerGlow.rotation.x = -Math.PI / 2;
          this.centerGlow.position.y = 0.02;
          this.add(this.centerGlow);

          this.light = new THREE.PointLight(0x44ff88, 2, 15);
          this.light.position.y = 2;
          this.add(this.light);
        }

        update(delta) {
          super.update(delta);

          // Particles rise
          this.particles.forEach((p) => {
            p.position.y += delta * p.userData.speed;
            p.position.x =
              p.userData.baseX +
              Math.sin(this.age * 3 + p.userData.phase) * 0.2;
            p.position.z =
              p.userData.baseZ +
              Math.cos(this.age * 3 + p.userData.phase) * 0.2;

            if (p.position.y > 5) {
              p.position.y = 0;
            }
            p.material.opacity = 0.8 * (1 - p.position.y / 5);
          });

          // Rings rise
          this.rings.forEach((ring) => {
            const age = this.age - ring.userData.delay;
            if (age > 0) {
              ring.position.y = ring.userData.baseY + (age % 1.5) * 4;
              ring.rotation.z = age * 2;
              ring.material.opacity = 0.6 * (1 - (age % 1.5) / 1.5);
            }
          });

          // Pulse glow
          const pulse = 0.3 + Math.sin(this.age * 5) * 0.1;
          this.centerGlow.material.opacity = pulse;

          return this.age < this.maxAge;
        }
      }

            p.material.opacity *= 0.97;
            p.scale.multiplyScalar(0.99);

              ring.material.opacity = Math.max(0, 0.8 - age * 0.5);

      class ChargeSpell extends SpellEffect {
        constructor() {
          super({ duration: 1.5 });

          // Player position marker (start)
          this.startMarker = new THREE.Group();
          this.startMarker.position.set(-8, 0, 0);

          // Trail particles (dust + speed lines)
          this.trail = [];
          for (let i = 0; i < 100; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.1 + Math.random() * 0.15,
              4,
              4,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: 0x886644,
              transparent: true,
              opacity: 0.7,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            particle.position.set(
              -8 + (Math.random() - 0.5) * 2,
              Math.random() * 2,
              (Math.random() - 0.5) * 2,
            );
            particle.userData = {
              velocity: new THREE.Vector3(0, 0, 0),
              isTrail: true,
              delay: Math.random() * 0.5,
            };
            this.add(particle);
            this.trail.push(particle);
          }

          // Speed lines
          this.speedLines = [];
          for (let i = 0; i < 30; i++) {
            const lineGeo = new THREE.BufferGeometry();
            const x = (Math.random() - 0.5) * 4;
            const y = 0.5 + Math.random() * 2;
            const z = (Math.random() - 0.5) * 4;
            const length = 0.5 + Math.random() * 1;
            lineGeo.setFromPoints([
              new THREE.Vector3(x, y, z),
              new THREE.Vector3(x - length, y, z),
            ]);
            const lineMat = new THREE.LineBasicMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 0.5,
            });
            const line = new THREE.Line(lineGeo, lineMat);
            line.position.x = -8;
            line.userData = { startX: -8, delay: Math.random() * 0.8 };
            this.add(line);
            this.speedLines.push(line);
          }

          // Impact effect (created on arrival)
          this.hasImpacted = false;
          this.impactParticles = [];
        }

        update(delta) {
          super.update(delta);

          const chargeDuration = 0.6;

          if (this.age < chargeDuration) {
            // Speed lines follow charge
            this.speedLines.forEach((line) => {
              const progress = this.age / chargeDuration;
              line.position.x = -8 + progress * 16 + line.userData.delay * 5;
              line.material.opacity = 0.5 * (1 - progress);
            });

            // Trail dust
            this.trail.forEach((p) => {
              if (this.age > p.userData.delay) {
                p.position.x += delta * 25;
                p.material.opacity *= 0.95;
              }
            });
          } else if (!this.hasImpacted) {
            this.hasImpacted = true;
            this.createImpact();
          }

          if (this.hasImpacted) {
            // Impact particles
            this.impactParticles.forEach((p) => {
              p.position.add(p.userData.velocity.clone().multiplyScalar(delta));
              p.userData.velocity.y -= delta * 10;
              p.material.opacity *= 0.94;
            });

            // Shockwave
            if (this.shockwave) {
              const age = this.age - chargeDuration;
              const scale = 1 + age * 12;
              this.shockwave.scale.set(scale, scale, 1);
              this.shockwave.material.opacity = Math.max(0, 1 - age * 1.5);
            }
          }

          return this.age < this.maxAge;
        }

        createImpact() {
          // Impact burst
          for (let i = 0; i < 80; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.1 + Math.random() * 0.15,
              6,
              6,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color().setHSL(0, 0.7, 0.5),
              transparent: true,
              opacity: 1,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            particle.position.set(8, 1.5, 0);

            const theta = Math.random() * Math.PI * 2;
            const speed = 5 + Math.random() * 10;

            particle.userData = {
              velocity: new THREE.Vector3(
                speed * Math.cos(theta),
                3 + Math.random() * 5,
                speed * Math.sin(theta),
              ),
            };
            this.add(particle);
            this.impactParticles.push(particle);
          }

          // Shockwave
          const ringGeo = new THREE.RingGeometry(0.3, 0.8, 32);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0xff6644,
            transparent: true,
            opacity: 1,
            side: THREE.DoubleSide,
          });
          this.shockwave = new THREE.Mesh(ringGeo, ringMat);
          this.shockwave.rotation.x = -Math.PI / 2;
          this.shockwave.position.set(8, 0.1, 0);
          this.add(this.shockwave);
        }
      }

            particle.userData = {

              baseY: y,

            };
            this.add(particle);

          }

          // Dust on ground
          this.dust = [];

            const pGeo = new THREE.SphereGeometry(
              0.08 + Math.random() * 0.12,

              4,

              color: 0x665544,
              transparent: true,
              opacity: 0.6,
            });
            const dust = new THREE.Mesh(pGeo, pMat);
            const theta = Math.random() * Math.PI * 2;
            const r = 3 + Math.random() * 3;
            dust.position.set(r * Math.cos(theta), 0.1, r * Math.sin(theta));
            dust.userData = {
              baseTheta: theta,
              baseR: r,
              speed: 1 + Math.random() * 2,
            };
            this.add(dust);
            this.dust.push(dust);
          }

          // Center glow

          const glowMat = new THREE.MeshBasicMaterial({

          // Rotate blades
          this.blades.forEach((blade) => {
            blade.rotation.z +=
              delta * blade.userData.speed * blade.userData.direction;
            const scale = 1 + Math.sin(this.age * 10) * 0.05;
            blade.scale.set(scale, scale, 1);
            blade.material.opacity = 0.8 * (1 - this.age / this.maxAge);
          });

          // Inner particles spiral up
          this.innerParticles.forEach((p) => {
            p.userData.baseTheta += delta * p.userData.speed;
            const r = p.userData.baseR;
            const theta = p.userData.baseTheta;
            p.position.x = r * Math.cos(theta);
            p.position.z = r * Math.sin(theta);
            p.position.y =
              p.userData.baseY +
              Math.sin(this.age * 3 + p.userData.baseTheta) * 0.3;
            p.material.opacity = 0.8 * (1 - this.age / this.maxAge);
          });

          // Dust spiral
          this.dust.forEach((d) => {
            d.userData.baseTheta += delta * d.userData.speed;
            const r = d.userData.baseR;
            const theta = d.userData.baseTheta;
            d.position.x = r * Math.cos(theta);
            d.position.z = r * Math.sin(theta);
            d.material.opacity = 0.6 * (1 - this.age / this.maxAge);
          });

          // Pulse glow
          this.centerGlow.material.opacity =
            0.4 * Math.sin(this.age * 5) * (1 - this.age / this.maxAge);

          return this.age < this.maxAge;
        }
      }

                0.5,
                blade.userData.startY - age * 15,
              );
              blade.material.opacity = Math.max(0, 1 - age);

          });

          // Particles burst
          this.particles.forEach((p) => {

            const age = this.age - 0.3;
            const scale = 1 + age * 10;
            this.impactRing.scale.set(scale, scale, 1);
            this.impactRing.material.opacity = Math.max(0, 1 - age * 2);

          return this.age < this.maxAge;

                arrow.visible = false;

          for (let i = 0; i < 12; i++) {
            const leafGeo = new THREE.SphereGeometry(0.1, 4, 4);
            const leafMat = new THREE.MeshBasicMaterial({
              color: 0x66aa33,

            });

            leaf.userData = {
              angle: (i / 12) * Math.PI * 2,
              radius: 0.6,
              speed: 5,
            };
            this.add(leaf);
            this.leaves.push(leaf);
          }

          // Trail
          this.trail = [];
          for (let i = 0; i < 50; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.05 + Math.random() * 0.08,
              4,
              4,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: 0x99dd55,
              transparent: true,
              opacity: 0.6,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            particle.userData = {
              offset: new THREE.Vector3(
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
              ),
              life: Math.random(),
            };
            this.add(particle);
            this.trail.push(particle);
          }

          this.startX = -8;
          this.targetX = 10;
        }

        update(delta) {
          super.update(delta);

          const flyDuration = 0.8;
          const progress = Math.min(this.age / flyDuration, 1);

          this.ball.position.x =
            this.startX + progress * (this.targetX - this.startX);
          this.ball.rotation.x += delta * 3;

          // Leaves orbit
          this.leaves.forEach((leaf) => {
            leaf.userData.angle += delta * leaf.userData.speed;
            const angle = leaf.userData.angle;
            const r = leaf.userData.radius;
            leaf.position.copy(this.ball.position);
            leaf.position.x += Math.cos(angle) * r;
            leaf.position.z += Math.sin(angle) * r;
            leaf.position.y += Math.sin(angle * 2) * 0.3;
          });

          // Trail
          this.trail.forEach((p) => {
            p.userData.life += delta;
            if (p.userData.life > 0.3) {
              p.userData.life = 0;
              p.position.copy(this.ball.position).add(p.userData.offset);
            }
            p.material.opacity = 0.6 * (1 - p.userData.life / 0.3);
          });

          if (progress >= 1) {
            this.ball.material.opacity *= 0.9;
            this.leaves.forEach((l) => (l.material.opacity *= 0.85));
          }

          return this.age < this.maxAge;
        }

              transparent: true,
              opacity: 0.5,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 0.5;
            ring.userData = { delay: i * 0.3, baseY: 0.5 };
            this.add(ring);
            this.rings.push(ring);
          }
        }

        update(delta) {
          super.update(delta);

          // Particles rise
          this.particles.forEach((p) => {
            p.position.y += delta * p.userData.speed;
            if (p.position.y > 4) p.position.y = 0;

            p.userData.baseTheta += delta;
            const r = p.userData.baseR;
            p.position.x = r * Math.cos(p.userData.baseTheta);
            p.position.z = r * Math.sin(p.userData.baseTheta);

            p.material.opacity =
              0.8 *
              Math.sin(this.age * 2 + p.userData.phase) *
              (1 - this.age / this.maxAge);
          });

          // Leaves fall then rise
          this.leaves.forEach((l) => {
            l.position.y -= delta * l.userData.fallSpeed;
            if (l.position.y < 0) l.position.y = 5;
            l.rotation.x += delta * l.userData.spinSpeed;
            l.rotation.z += delta * l.userData.spinSpeed * 0.7;
            l.material.opacity = 0.7 * (1 - this.age / this.maxAge);
          });

          // Glow pulse
          this.glow.material.opacity =
            0.4 * Math.sin(this.age * 3) * (1 - this.age / this.maxAge);

          // Rings rise
          this.rings.forEach((r) => {
            const age = this.age - r.userData.delay;
            if (age > 0) {
              r.position.y = r.userData.baseY + (age % 1) * 3;
              r.rotation.z = age * 2;
              r.material.opacity =
                0.5 * (1 - (age % 1)) * (1 - this.age / this.maxAge);
            }
          });

          return this.age < this.maxAge;
        }
      }

      class ThornsSpell extends SpellEffect {
        constructor() {
          super({ duration: 2.5 });

          // Thorn spikes around player
          this.thorns = [];
          for (let i = 0; i < 16; i++) {
            const thornGeo = new THREE.ConeGeometry(0.15, 1.2, 4);
            const thornMat = new THREE.MeshBasicMaterial({
              color: 0x668844,
              transparent: true,
              opacity: 0.9,
            });
            const thorn = new THREE.Mesh(thornGeo, thornMat);
            const angle = (i / 16) * Math.PI * 2;
            thorn.position.set(Math.cos(angle) * 2, 0.6, Math.sin(angle) * 2);
            thorn.rotation.z = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
            thorn.rotation.y = angle;
            thorn.userData = { baseAngle: angle, delay: Math.random() * 0.3 };
            this.add(thorn);
            this.thorns.push(thorn);
          }

          // Spiky aura
          this.auraParticles = [];
          for (let i = 0; i < 80; i++) {
            const pGeo = new THREE.OctahedronGeometry(
              0.08 + Math.random() * 0.08,
              0,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: 0x88aa55,
              transparent: true,
              opacity: 0.7,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            const theta = Math.random() * Math.PI * 2;
            const r = 1.5 + Math.random() * 1.5;
            const y = Math.random() * 2.5;
            particle.position.set(r * Math.cos(theta), y, r * Math.sin(theta));
            particle.userData = {
              baseTheta: theta,
              baseR: r,
              baseY: y,
              speed: 1 + Math.random() * 2,
              spinSpeed: 2 + Math.random() * 4,
            };
            this.add(particle);
            this.auraParticles.push(particle);
          }

          // Ground vine circle
          const vineGeo = new THREE.TorusGeometry(2, 0.1, 8, 32);
          const vineMat = new THREE.MeshBasicMaterial({
            color: 0x557733,
            transparent: true,
            opacity: 0.7,
          });
          this.vine = new THREE.Mesh(vineGeo, vineMat);
          this.vine.rotation.x = -Math.PI / 2;
          this.vine.position.y = 0.05;
          this.add(this.vine);
        }

        update(delta) {
          super.update(delta);

          // Thorns pulse
          this.thorns.forEach((thorn) => {
            const age = this.age - thorn.userData.delay;
            if (age > 0) {
              const scale = 1 + Math.sin(this.age * 6) * 0.15;
              thorn.scale.setScalar(scale);
              thorn.rotation.y =
                thorn.userData.baseAngle + Math.sin(this.age * 2) * 0.1;
            }
            thorn.material.opacity = 0.9 * (1 - this.age / this.maxAge);
          });

          // Aura particles orbit
          this.auraParticles.forEach((p) => {
            p.userData.baseTheta += delta * p.userData.speed;
            const theta = p.userData.baseTheta;
            const r = p.userData.baseR;
            p.position.x = r * Math.cos(theta);
            p.position.z = r * Math.sin(theta);
            p.rotation.x += delta * p.userData.spinSpeed;
            p.rotation.y += delta * p.userData.spinSpeed * 0.7;
            p.material.opacity = 0.7 * (1 - this.age / this.maxAge);
          });

          // Vine grow
          this.vine.scale.setScalar(1 + this.age * 0.2);
          this.vine.rotation.z += delta;
          this.vine.material.opacity = 0.7 * (1 - this.age / this.maxAge);

          return this.age < this.maxAge;
        }
      }

      class SunfireSpell extends SpellEffect {
        constructor() {
          super({ duration: 2.5 });

          // Sun core
          const sunGeo = new THREE.SphereGeometry(0.6, 32, 32);
          const sunMat = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            transparent: true,
            opacity: 1,
          });
          this.sun = new THREE.Mesh(sunGeo, sunMat);
          this.sun.position.y = 2;
          this.add(this.sun);

          // Solar flares
          this.flares = [];
          for (let i = 0; i < 200; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.08 + Math.random() * 0.15,
              4,
              4,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color().setHSL(
                0.1 + Math.random() * 0.05,
                1,
                0.5 + Math.random() * 0.3,
              ),
              transparent: true,
              opacity: 0.9,
            });
            const particle = new THREE.Mesh(pGeo, pMat);

            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const r = 0.7 + Math.random() * 0.5;

            particle.position.set(
              r * Math.sin(phi) * Math.cos(theta),
              2 + r * Math.cos(phi),
              r * Math.sin(phi) * Math.sin(theta),
            );

            const speed = 2 + Math.random() * 4;
            particle.userData = {
              velocity: new THREE.Vector3(
                speed * Math.sin(phi) * Math.cos(theta),
                speed * Math.cos(phi),
                speed * Math.sin(phi) * Math.sin(theta),
              ),
            };
            this.add(particle);
            this.flares.push(particle);
          }

          // Ground burning circle
          const burnGeo = new THREE.CircleGeometry(3, 32);
          const burnMat = new THREE.MeshBasicMaterial({
            color: 0xff6600,
            transparent: true,
            opacity: 0.5,
          });
          this.burn = new THREE.Mesh(burnGeo, burnMat);
          this.burn.rotation.x = -Math.PI / 2;
          this.burn.position.y = 0.02;
          this.add(this.burn);

          // Light
          this.light = new THREE.PointLight(0xffaa00, 5, 20);
          this.light.position.y = 2;
          this.add(this.light);
        }

        update(delta) {
          super.update(delta);

          // Sun pulse
          const scale = 1 + Math.sin(this.age * 8) * 0.2;
          this.sun.scale.setScalar(scale);
          this.sun.material.opacity = 1 * (1 - this.age / this.maxAge);

          // Flares expand
          this.flares.forEach((f) => {
            f.position.add(f.userData.velocity.clone().multiplyScalar(delta));
            f.userData.velocity.multiplyScalar(0.98);
            f.material.opacity *= 0.98;
          });

          // Burn spread
          this.burn.scale.setScalar(1 + this.age * 0.5);
          this.burn.material.opacity =
            0.5 * Math.sin(this.age * 4) * (1 - this.age / this.maxAge);

          // Light flicker
          this.light.intensity =
            5 *
            (1 + Math.sin(this.age * 10) * 0.3) *
            (1 - this.age / this.maxAge);

          return this.age < this.maxAge;
        }
      }

      class BearformSpell extends SpellEffect {
        constructor() {
          super({ duration: 3 });

          // Transformation particles
          this.transformParticles = [];
          for (let i = 0; i < 200; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.1 + Math.random() * 0.15,
              4,
              4,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color().setHSL(
                0.08 + Math.random() * 0.04,
                0.5,
                0.3 + Math.random() * 0.2,
              ),
              transparent: true,
              opacity: 0.8,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            const theta = Math.random() * Math.PI * 2;
            const r = 3 + Math.random() * 3;
            particle.position.set(
              r * Math.cos(theta),
              Math.random() * 4,
              r * Math.sin(theta),
            );
            particle.userData = {
              targetR: 0.5 + Math.random() * 0.5,
              targetTheta: Math.random() * Math.PI * 2,
              targetY: 0.5 + Math.random() * 2,
              speed: 2 + Math.random() * 3,
            };
            this.add(particle);
            this.transformParticles.push(particle);
          }

          // Bear silhouette (appears during transform)
          const bearGeo = new THREE.CapsuleGeometry(0.8, 1.5, 8, 16);
          const bearMat = new THREE.MeshBasicMaterial({
            color: 0x665533,
            transparent: true,
            opacity: 0,
          });
          this.bear = new THREE.Mesh(bearGeo, bearMat);
          this.bear.position.y = 1.3;
          this.add(this.bear);

          // Ground stomp effect
          this.stompWave = null;
        }

        update(delta) {
          super.update(delta);

          // Particles converge to center
          const convergeTime = 1;
          if (this.age < convergeTime) {
            this.transformParticles.forEach((p) => {
              p.position.x +=
                (p.userData.targetR * Math.cos(p.userData.targetTheta) -
                  p.position.x) *
                delta *
                p.userData.speed;
              p.position.y +=
                (p.userData.targetY - p.position.y) * delta * p.userData.speed;
              p.position.z +=
                (p.userData.targetR * Math.sin(p.userData.targetTheta) -
                  p.position.z) *
                delta *
                p.userData.speed;
            });

            // Bear fades in
            this.bear.material.opacity = (this.age / convergeTime) * 0.9;
          } else {
            // Bear fully formed
            this.bear.material.opacity = 0.9;

            // Create stomp wave
            if (!this.stompWave) {
              this.createStomp();
            }
          }

          // Fade out
          if (this.age > 2) {
            this.transformParticles.forEach((p) => {
              p.material.opacity *= 0.95;
            });
            this.bear.material.opacity *= 0.95;
          }

          // Stomp wave
          if (this.stompWave) {
            const stompAge = this.age - 1;
            const scale = 1 + stompAge * 5;
            this.stompWave.scale.set(scale, scale, 1);
            this.stompWave.material.opacity = Math.max(0, 0.8 - stompAge * 0.8);
          }

          return this.age < this.maxAge;
        }

        createStomp() {
          const ringGeo = new THREE.RingGeometry(0.5, 0.8, 32);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0x887755,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide,
          });
          this.stompWave = new THREE.Mesh(ringGeo, ringMat);
          this.stompWave.rotation.x = -Math.PI / 2;
          this.stompWave.position.y = 0.05;
          this.add(this.stompWave);
        }
      }

      class TranquilitySpell extends SpellEffect {
        constructor() {
          super({ duration: 4 });

          // Gentle falling petals
          this.petals = [];
          for (let i = 0; i < 100; i++) {
            const petalGeo = new THREE.SphereGeometry(0.08, 4, 4);
            const petalMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color().setHSL(
                0.9 + Math.random() * 0.1,
                0.5,
                0.7 + Math.random() * 0.2,
              ),
              transparent: true,
              opacity: 0.8,
            });
            const petal = new THREE.Mesh(petalGeo, petalMat);
            const theta = Math.random() * Math.PI * 2;
            const r = Math.random() * 5;
            petal.position.set(
              r * Math.cos(theta),
              5 + Math.random() * 5,
              r * Math.sin(theta),
            );
            petal.userData = {
              fallSpeed: 0.5 + Math.random() * 0.5,
              swayPhase: Math.random() * Math.PI * 2,
              swaySpeed: 1 + Math.random() * 2,
              swayAmount: 0.5 + Math.random() * 0.5,
            };
            this.add(petal);
            this.petals.push(petal);
          }

          // Rising healing energy
          this.healingEnergy = [];
          for (let i = 0; i < 150; i++) {
            const pGeo = new THREE.SphereGeometry(
              0.05 + Math.random() * 0.08,
              4,
              4,
            );
            const pMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color().setHSL(
                0.35 + Math.random() * 0.1,
                0.7,
                0.6,
              ),
              transparent: true,
              opacity: 0.7,
            });
            const particle = new THREE.Mesh(pGeo, pMat);
            const theta = Math.random() * Math.PI * 2;
            const r = Math.random() * 4;
            particle.position.set(
              r * Math.cos(theta),
              Math.random() * 3,
              r * Math.sin(theta),
            );
            particle.userData = {
              baseTheta: theta,
              baseR: r,
              speed: 0.5 + Math.random() * 1,
              phase: Math.random() * Math.PI * 2,
            };
            this.add(particle);
            this.healingEnergy.push(particle);
          }

          // Central tree of life symbol
          const treeGeo = new THREE.CylinderGeometry(0.1, 0.15, 1.5, 6);
          const treeMat = new THREE.MeshBasicMaterial({
            color: 0x66aa44,
            transparent: true,
            opacity: 0.7,
          });
          this.tree = new THREE.Mesh(treeGeo, treeMat);
          this.tree.position.y = 0.75;
          this.add(this.tree);

          // Canopy
          const canopyGeo = new THREE.SphereGeometry(1.5, 8, 6);
          const canopyMat = new THREE.MeshBasicMaterial({
            color: 0x88cc55,
            transparent: true,
            opacity: 0.4,
          });
          this.canopy = new THREE.Mesh(canopyGeo, canopyMat);
          this.canopy.position.y = 2;
          this.canopy.scale.set(1, 0.6, 1);
          this.add(this.canopy);

          // Ground healing circle
          const circleGeo = new THREE.RingGeometry(3, 4, 32);
          const circleMat = new THREE.MeshBasicMaterial({
            color: 0x88dd66,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
          });
          this.circle = new THREE.Mesh(circleGeo, circleMat);
          this.circle.rotation.x = -Math.PI / 2;
          this.circle.position.y = 0.02;
          this.add(this.circle);

          // Light
          this.light = new THREE.PointLight(0x88ff66, 2, 15);
          this.light.position.y = 2;
          this.add(this.light);
        }

        update(delta) {
          super.update(delta);

          // Petals fall
          this.petals.forEach((petal) => {
            petal.position.y -= delta * petal.userData.fallSpeed;
            petal.position.x +=
              Math.sin(
                this.age * petal.userData.swaySpeed + petal.userData.swayPhase,
              ) *
              delta *
              petal.userData.swayAmount;
            petal.position.z +=
              Math.cos(
                this.age * petal.userData.swaySpeed + petal.userData.swayPhase,
              ) *
              delta *
              petal.userData.swayAmount;
            petal.rotation.x += delta;
            petal.rotation.z += delta * 0.7;

            if (petal.position.y < 0) {
              petal.position.y = 8;
              const theta = Math.random() * Math.PI * 2;
              const r = Math.random() * 5;
              petal.position.x = r * Math.cos(theta);
              petal.position.z = r * Math.sin(theta);
            }

            petal.material.opacity = 0.8 * (1 - this.age / this.maxAge);
          });

          // Healing energy rises
          this.healingEnergy.forEach((p) => {
            p.position.y += delta * p.userData.speed;
            if (p.position.y > 4) p.position.y = 0;

            p.userData.baseTheta += delta * 0.5;
            const r = p.userData.baseR;
            p.position.x = r * Math.cos(p.userData.baseTheta);
            p.position.z = r * Math.sin(p.userData.baseTheta);

            p.material.opacity =
              0.7 *
              Math.sin(this.age * 2 + p.userData.phase) *
              (1 - this.age / this.maxAge);
          });

          // Tree pulse
          const scale = 1 + Math.sin(this.age * 3) * 0.1;
          this.tree.scale.set(scale, 1, scale);
          this.canopy.scale.set(
            1 + Math.sin(this.age * 2) * 0.1,
            0.6,
            1 + Math.sin(this.age * 2) * 0.1,
          );

          // Circle rotate
          this.circle.rotation.z += delta * 0.3;
          this.circle.material.opacity =
            0.4 * Math.sin(this.age * 2) * (1 - this.age / this.maxAge);

          // Light pulse
          this.light.intensity =
            2 *
            (1 + Math.sin(this.age * 4) * 0.3) *
            (1 - this.age / this.maxAge);

          return this.age < this.maxAge;
        }
      }

      // ==================== SPELL FACTORY ====================

      function createSpell(className, skillKey) {
        switch (className + "_" + skillKey) {
          // Mage
          case "mage_fireball":
            return new FireballSpell();
          case "mage_icebolt":
            return new IceBoltSpell();
          case "mage_meteor":
            return new MeteorSpell();
          case "mage_chainlightning":
            return new ChainLightningSpell();
          case "mage_heal":
            return new HealSpell();
          case "mage_nova":
            return new NovaSpell();

          // Warrior
          case "warrior_slash":
            return new SlashSpell();
          case "warrior_charge":
            return new ChargeSpell();
          case "warrior_whirlwind":
            return new WhirlwindSpell();
          case "warrior_shieldbash":
            return new ShieldBashSpell();
          case "warrior_battlecry":
            return new BattlecrySpell();
          case "warrior_execute":
            return new ExecuteSpell();

          // Archer
          case "archer_quickshot":
            return new QuickshotSpell();
          case "archer_multishot":
            return new MultishotSpell();
          case "archer_poisonarrow":
            return new PoisonarrowSpell();
          case "archer_arrowrain":
            return new ArrowrainSpell();
          case "archer_evasion":
            return new EvasionSpell();
          case "archer_snipe":
            return new SnipeSpell();

          // Druid
          case "druid_wrath":
            return new WrathSpell();
          case "druid_rejuvenation":
            return new RejuvenationSpell();
          case "druid_thorns":
            return new ThornsSpell();
          case "druid_sunfire":
            return new SunfireSpell();
          case "druid_bearform":
            return new BearformSpell();
          case "druid_tranquility":
            return new TranquilitySpell();

          default:
            return new FireballSpell();
        }
      }

      // ==================== ANIMATION LOOP ====================

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        controls.update();

        if (currentEffect) {
          if (!currentEffect.update(delta)) {
            currentEffect.dispose();
            currentEffect = null;
          }
        }

        renderer.render(scene, camera);
      }

      // ==================== UI FUNCTIONS ====================

      function updateClassInfo(className) {
        const config = classConfigs[className];
        document.getElementById("class-icon").textContent = config.icon;
        document.getElementById("class-name").textContent = config.name;
        document.getElementById("class-name-en").textContent = config.nameEn;
        document.getElementById("class-description").textContent =
          config.description;
        document.getElementById("stat-hp").textContent = config.baseHP;
        document.getElementById("stat-mp").textContent = config.baseMP;
        document.getElementById("stat-atk").textContent = config.baseAttack;

        const infoBox = document.getElementById("class-info");
        infoBox.style.borderColor = config.color + "30";
      }

      function renderSkillsList(className) {
        const config = classConfigs[className];
        const list = document.getElementById("skills-list");
        list.innerHTML = "";

        Object.entries(config.skills).forEach(([key, skill], index) => {
          const btn = document.createElement("button");
          btn.className =
            "skill-btn w-full p-3 rounded-xl bg-black/30 border border-white/5 text-left flex items-center gap-3 hover:bg-black/50 animate-slideIn";
          btn.style.animationDelay = `${index * 0.05}s`;
          btn.style.borderLeft = `3px solid ${config.color}`;

          btn.innerHTML = `
                    <span class="text-xl">${skill.icon}</span>
                    <div class="flex-1 min-w-0">
                        <p class="font-medium text-sm truncate">${skill.name}</p>
                        <p class="text-xs text-gray-500 truncate">${skill.description}</p>
                    </div>
                    <span class="text-xs text-gray-600 shrink-0">${skill.manaCost || 0} MP</span>
                `;

          btn.addEventListener("click", () => triggerSkill(className, key));
          list.appendChild(btn);
        });
      }

      function triggerSkill(className, skillKey) {
        const config = classConfigs[className];
        const skill = config.skills[skillKey];

        // Clear previous
        if (currentEffect) {
          currentEffect.dispose();
          currentEffect = null;
        }

        // Show cast indicator
        const indicator = document.getElementById("cast-indicator");
        indicator.classList.remove("hidden");
        indicator.querySelector(".cast-ring").style.borderColor = config.color;
        setTimeout(() => indicator.classList.add("hidden"), 500);

        // Create spell
        currentEffect = createSpell(className, skillKey);

        // Update display
        const display = document.getElementById("skill-display");
        document.getElementById("skill-icon-display").textContent = skill.icon;
        document.getElementById("skill-name-display").textContent = skill.name;
        document.getElementById("skill-desc-display").textContent =
          skill.description;
        display.style.opacity = "1";
        display.style.borderColor = config.color + "40";

        document.getElementById("hint").style.opacity = "0";

        // Update details
        const panel = document.getElementById("skill-detail-panel");
        const content = document.getElementById("skill-detail-content");
        panel.style.opacity = "1";

        content.innerHTML = `
                <div class="flex items-center gap-3 mb-4 p-3 rounded-xl bg-black/40 border border-white/5">
                    <span class="text-3xl">${skill.icon}</span>
                    <div>
                        <h4 class="font-display text-sm font-bold">${skill.name}</h4>
                        <p class="text-xs text-gray-500">${skill.description}</p>
                    </div>
                </div>
                <div class="space-y-2 text-sm">
                    ${skill.damage ? `<div class="flex justify-between p-2 rounded-lg bg-black/20"><span class="text-gray-400">Damage</span><span style="color:${config.color}">${skill.damage}</span></div>` : ""}
                    ${skill.healAmount ? `<div class="flex justify-between p-2 rounded-lg bg-black/20"><span class="text-gray-400">Heal</span><span class="text-green-400">${skill.healAmount}</span></div>` : ""}
                    <div class="flex justify-between p-2 rounded-lg bg-black/20"><span class="text-gray-400">Cooldown</span><span>${skill.maxCooldown}s</span></div>
                    <div class="flex justify-between p-2 rounded-lg bg-black/20"><span class="text-gray-400">Mana</span><span class="text-blue-400">${skill.manaCost || 0}</span></div>
                </div>
            `;

        setTimeout(() => (display.style.opacity = "0"), 2500);
      }

      function setupUI() {
        const tabs = document.querySelectorAll(".class-tab");

        tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            const cls = tab.dataset.class;

            tabs.forEach((t) => {
              t.classList.remove("active");
              t.style.backgroundColor = "";
            });
            tab.classList.add("active");
            tab.style.backgroundColor = classConfigs[cls].color + "20";

            updateClassInfo(cls);
            renderSkillsList(cls);
            document.getElementById("skill-detail-panel").style.opacity = "0";
          });
        });

        // Init first class
        tabs[0].click();
      }

      // Initialize
      init();
      setupUI();
    </script>
  </body>
</html>
