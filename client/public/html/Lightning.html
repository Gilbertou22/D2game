<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diablo 2 Lightning</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #020208;
        font-family: "Palatino Linotype", "Book Antiqua", serif;
        cursor: crosshair;
      }
      #container {
        width: 100vw;
        height: 100vh;
      }

      #ui {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 100;
      }

      #skill-orb {
        width: 85px;
        height: 85px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #aaccff,
          #4477cc 50%,
          #223366
        );
        border: 3px solid #4466aa;
        box-shadow:
          0 0 25px rgba(100, 150, 255, 0.7),
          0 0 50px rgba(80, 120, 220, 0.4),
          inset 0 0 25px rgba(150, 200, 255, 0.5);
        cursor: pointer;
        position: relative;
        transition: all 0.2s ease;
        animation: orbPulse 2s ease-in-out infinite;
      }

      @keyframes orbPulse {
        0%,
        100% {
          box-shadow:
            0 0 25px rgba(100, 150, 255, 0.7),
            0 0 50px rgba(80, 120, 220, 0.4),
            inset 0 0 25px rgba(150, 200, 255, 0.5);
        }
        50% {
          box-shadow:
            0 0 40px rgba(120, 180, 255, 0.9),
            0 0 70px rgba(100, 150, 255, 0.6),
            inset 0 0 35px rgba(180, 220, 255, 0.7);
        }
      }

      #skill-orb:hover {
        transform: scale(1.15);
        box-shadow:
          0 0 50px rgba(120, 180, 255, 1),
          0 0 80px rgba(100, 150, 255, 0.7),
          inset 0 0 40px rgba(200, 230, 255, 0.8);
      }

      #skill-name {
        color: #88aaff;
        font-size: 1.3em;
        text-shadow:
          0 0 15px #4488ff,
          0 0 30px #2266cc;
        margin-top: 12px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      #info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #6688aa;
        background: rgba(5, 10, 20, 0.95);
        padding: 18px;
        border-left: 3px solid #4488ff;
        font-size: 0.9em;
        box-shadow: 0 0 20px rgba(50, 100, 200, 0.2);
      }

      #info h3 {
        color: #88ccff;
        margin-bottom: 10px;
        text-shadow: 0 0 8px #4499ff;
        font-size: 1.2em;
      }

      #combo-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 4em;
        color: #ccddff;
        text-shadow:
          0 0 10px #ffffff,
          0 0 30px #88bbff,
          0 0 50px #4488ff;
        opacity: 0;
        pointer-events: none;
        letter-spacing: 10px;
        font-weight: bold;
      }

      #combo-text.show {
        animation: lightningCombo 0.6s ease-out forwards;
      }

      @keyframes lightningCombo {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.5);
          filter: blur(20px);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.1);
          filter: blur(0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1) translateY(-40px);
          filter: blur(5px);
        }
      }

      .controls {
        position: fixed;
        bottom: 25px;
        right: 25px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .spell-btn {
        background: linear-gradient(180deg, #1a2244 0%, #0a1020 100%);
        border: 2px solid #334488;
        color: #88aadd;
        padding: 12px 22px;
        font-family: inherit;
        font-size: 0.95em;
        cursor: pointer;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        text-transform: uppercase;
      }

      .spell-btn:hover {
        background: linear-gradient(180deg, #2a3366 0%, #1a2244 100%);
        box-shadow: 0 0 20px rgba(80, 140, 255, 0.5);
        color: #aaccff;
      }

      .spell-btn.active {
        border-color: #6699ff;
        box-shadow:
          0 0 25px rgba(100, 160, 255, 0.7),
          inset 0 0 15px rgba(100, 150, 255, 0.3);
        color: #ccddff;
      }

      .target-indicator {
        position: absolute;
        pointer-events: none;
        width: 30px;
        height: 30px;
        border: 2px solid rgba(100, 180, 255, 0.5);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: targetPulse 1s ease-in-out infinite;
      }

      @keyframes targetPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.5;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.3);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <div id="info">
      <h3>Lightning Spells</h3>
      <div>Click to cast</div>
      <div>1: Lightning Bolt</div>
      <div>2: Chain Lightning</div>
      <div>3: Nova</div>
    </div>

    <div id="combo-text">LIGHTNING</div>

    <div id="ui">
      <div id="skill-name">Lightning</div>
      <div id="skill-orb"></div>
    </div>

    <div class="controls">
      <button class="spell-btn active" data-spell="lightning">Lightning</button>
      <button class="spell-btn" data-spell="chain">Chain Lightning</button>
      <button class="spell-btn" data-spell="nova">Nova</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      // Scene setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020208);
      scene.fog = new THREE.FogExp2(0x020210, 0.02);

      const camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        500,
      );
      camera.position.set(0, 18, 22);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.getElementById("container").appendChild(renderer.domElement);

      // Post-processing
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.8,
        0.5,
        0.1,
      );
      bloomPass.threshold = 0.1;
      bloomPass.strength = 2.5;
      bloomPass.radius = 0.3;
      composer.addPass(bloomPass);

      // Lighting
      scene.add(new THREE.AmbientLight(0x112233, 0.4));

      const dirLight = new THREE.DirectionalLight(0x334466, 0.3);
      dirLight.position.set(5, 10, -5);
      scene.add(dirLight);

      // Ground
      const groundGeo = new THREE.PlaneGeometry(100, 100, 60, 60);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x0a0a15,
        roughness: 0.9,
        metalness: 0.2,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -2;
      scene.add(ground);

      // Grid
      const gridHelper = new THREE.GridHelper(100, 50, 0x1a2255, 0x0a1030);
      gridHelper.position.y = -1.98;
      scene.add(gridHelper);

      // Target dummies for Chain Lightning
      const targets = [];
      const targetGeometry = new THREE.SphereGeometry(0.5, 16, 16);
      const targetMaterial = new THREE.MeshStandardMaterial({
        color: 0x334455,
        emissive: 0x112233,
        roughness: 0.5,
        metalness: 0.5,
      });

      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = 5 + Math.random() * 5;
        const target = new THREE.Mesh(targetGeometry, targetMaterial.clone());
        target.position.set(
          Math.cos(angle) * radius,
          -1.5 + Math.random() * 2,
          Math.sin(angle) * radius,
        );
        target.userData.baseY = target.position.y;
        target.userData.offset = Math.random() * Math.PI * 2;
        scene.add(target);
        targets.push(target);
      }

      // Lightning system
      let currentSpell = "lightning";
      const activeSpells = [];

      // Lightning shader
      const lightningVertexShader = `
            attribute float aLineDistance;
            varying float vLineDistance;
            varying vec2 vUv;
            
            void main() {
                vLineDistance = aLineDistance;
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

      const lightningFragmentShader = `
            uniform vec3 uColor;
            uniform float uTime;
            uniform float uOpacity;
            varying float vLineDistance;
            varying vec2 vUv;
            
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }
            
            void main() {
                float intensity = 1.0 - abs(vUv.y - 0.5) * 2.0;
                intensity = pow(intensity, 0.5);
                
                float noise = random(vec2(vLineDistance, uTime)) * 0.3;
                intensity += noise;
                
                vec3 color = uColor * (1.0 + intensity * 0.5);
                color = mix(color, vec3(1.0), intensity * 0.4);
                
                gl_FragColor = vec4(color, intensity * uOpacity);
            }
        `;

      // Generate jagged lightning path
      function generateLightningPath(start, end, segments, offset) {
        const points = [start.clone()];
        const direction = end.clone().sub(start);
        const length = direction.length();
        direction.normalize();

        const midpoints = segments - 1;
        for (let i = 1; i <= midpoints; i++) {
          const t = i / (midpoints + 1);
          const point = start
            .clone()
            .add(direction.clone().multiplyScalar(length * t));

          // Perpendicular offset
          const perpendicular = new THREE.Vector3(-direction.z, 0, direction.x);
          const randomOffset = (Math.random() - 0.5) * offset;
          point.add(perpendicular.multiplyScalar(randomOffset));

          // Vertical variation
          point.y += (Math.random() - 0.5) * offset * 0.5;

          points.push(point);
        }
        points.push(end.clone());

        return points;
      }

      // Create lightning geometry
      function createLightningBolt(
        start,
        end,
        width,
        color,
        segments = 12,
        offset = 2,
      ) {
        const group = new THREE.Group();

        // Generate main path
        const points = generateLightningPath(start, end, segments, offset);

        // Create geometry for the bolt (using ribbon/triangle strip)
        const positions = [];
        const uvs = [];
        const lineDistances = [];

        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];

          const dir = p2.clone().sub(p1).normalize();
          const normal = new THREE.Vector3(-dir.z, 0, dir.x).normalize();

          const halfWidth = width * (1 - (i / points.length) * 0.5);

          // Quad vertices
          positions.push(
            p1.x + normal.x * halfWidth,
            p1.y,
            p1.z + normal.z * halfWidth,
            p1.x - normal.x * halfWidth,
            p1.y,
            p1.z - normal.z * halfWidth,
            p2.x + normal.x * halfWidth,
            p2.y,
            p2.z + normal.z * halfWidth,
            p2.x - normal.x * halfWidth,
            p2.y,
            p2.z - normal.z * halfWidth,
          );

          const d = i / points.length;
          uvs.push(0, 0, 1, 0, 0, 1, 1, 1);
          lineDistances.push(
            d,
            d,
            d + 1 / points.length,
            d + 1 / points.length,
          );
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3),
        );
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setAttribute(
          "aLineDistance",
          new THREE.Float32BufferAttribute(lineDistances, 1),
        );

        const material = new THREE.ShaderMaterial({
          vertexShader: lightningVertexShader,
          fragmentShader: lightningFragmentShader,
          uniforms: {
            uColor: { value: new THREE.Color(color) },
            uTime: { value: 0 },
            uOpacity: { value: 1.0 },
          },
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });

        const mesh = new THREE.Mesh(geometry, material);
        group.add(mesh);

        // Add branches
        const branchCount = Math.floor(Math.random() * 3) + 1;
        for (let i = 0; i < branchCount; i++) {
          const branchStartIdx = Math.floor(
            points.length * (0.2 + Math.random() * 0.5),
          );
          const branchStart = points[branchStartIdx];

          const branchDir = new THREE.Vector3(
            Math.random() - 0.5,
            (Math.random() - 0.5) * 0.3,
            Math.random() - 0.5,
          ).normalize();

          const branchLength = length * (0.2 + Math.random() * 0.3);
          const branchEnd = branchStart
            .clone()
            .add(branchDir.multiplyScalar(branchLength));
          branchEnd.y = Math.max(branchEnd.y, -1.5);

          const branchPoints = generateLightningPath(
            branchStart,
            branchEnd,
            5,
            offset * 0.5,
          );
          const branchGeom = createRibbonGeometry(branchPoints, width * 0.4);

          const branchMat = material.clone();
          branchMat.uniforms.uColor.value = new THREE.Color(
            color,
          ).multiplyScalar(0.7);
          const branchMesh = new THREE.Mesh(branchGeom, branchMat);
          group.add(branchMesh);
        }

        return { group, material };
      }

      function createRibbonGeometry(points, width) {
        const positions = [];
        const uvs = [];
        const lineDistances = [];

        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];

          const dir = p2.clone().sub(p1).normalize();
          const normal = new THREE.Vector3(-dir.z, 0, dir.x).normalize();

          const halfWidth = width;

          positions.push(
            p1.x + normal.x * halfWidth,
            p1.y,
            p1.z + normal.z * halfWidth,
            p1.x - normal.x * halfWidth,
            p1.y,
            p1.z - normal.z * halfWidth,
            p2.x + normal.x * halfWidth,
            p2.y,
            p2.z + normal.z * halfWidth,
            p2.x - normal.x * halfWidth,
            p2.y,
            p2.z - normal.z * halfWidth,
          );

          const d = i / points.length;
          uvs.push(0, 0, 1, 0, 0, 1, 1, 1);
          lineDistances.push(
            d,
            d,
            d + 1 / points.length,
            d + 1 / points.length,
          );
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3),
        );
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setAttribute(
          "aLineDistance",
          new THREE.Float32BufferAttribute(lineDistances, 1),
        );

        return geometry;
      }

      // Lightning spell classes
      class LightningBolt {
        constructor(start, end) {
          this.start = start.clone();
          this.end = end.clone();
          this.life = 0.4;
          this.maxLife = 0.4;
          this.time = 0;
          this.bolts = [];

          // Create multiple layers
          for (let i = 0; i < 3; i++) {
            const width = 0.3 - i * 0.08;
            const color = i === 0 ? 0xffffff : i === 1 ? 0x88ccff : 0x4488ff;
            const bolt = createLightningBolt(
              start,
              end,
              width,
              color,
              15,
              2.5 - i * 0.5,
            );
            bolt.group.userData.layer = i;
            this.bolts.push(bolt);
            scene.add(bolt.group);
          }

          // Impact light
          this.light = new THREE.PointLight(0x88bbff, 10, 15);
          this.light.position.copy(end);
          scene.add(this.light);

          // Spark particles at impact
          this.createImpactSparks(end);
        }

        createImpactSparks(position) {
          const count = 30;
          const geometry = new THREE.BufferGeometry();
          const positions = new Float32Array(count * 3);
          const colors = new Float32Array(count * 3);

          this.sparks = {
            positions: [],
            velocities: [],
            life: 0.6,
          };

          for (let i = 0; i < count; i++) {
            positions[i * 3] = position.x;
            positions[i * 3 + 1] = position.y;
            positions[i * 3 + 2] = position.z;

            colors[i * 3] = 0.7 + Math.random() * 0.3;
            colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
            colors[i * 3 + 2] = 1;

            this.sparks.positions.push(position.clone());
            this.sparks.velocities.push(
              new THREE.Vector3(
                (Math.random() - 0.5) * 15,
                Math.random() * 10,
                (Math.random() - 0.5) * 15,
              ),
            );
          }

          geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3),
          );
          geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

          const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });

          this.sparkMesh = new THREE.Points(geometry, material);
          scene.add(this.sparkMesh);
        }

        update(delta) {
          this.life -= delta;
          this.time += delta;

          // Flicker
          const flicker = Math.random() > 0.3 ? 1 : 0.3;

          this.bolts.forEach((bolt) => {
            bolt.material.uniforms.uTime.value = this.time;
            bolt.material.uniforms.uOpacity.value =
              Math.max(0, this.life / this.maxLife) * flicker;
          });

          this.light.intensity =
            10 * Math.max(0, this.life / this.maxLife) * flicker;

          // Update sparks
          if (this.sparks) {
            this.sparks.life -= delta;
            const positions = this.sparkMesh.geometry.attributes.position.array;

            for (let i = 0; i < this.sparks.positions.length; i++) {
              this.sparks.positions[i].add(
                this.sparks.velocities[i].clone().multiplyScalar(delta),
              );
              this.sparks.velocities[i].y -= 20 * delta;

              positions[i * 3] = this.sparks.positions[i].x;
              positions[i * 3 + 1] = this.sparks.positions[i].y;
              positions[i * 3 + 2] = this.sparks.positions[i].z;
            }

            this.sparkMesh.geometry.attributes.position.needsUpdate = true;
            this.sparkMesh.material.opacity = Math.max(
              0,
              this.sparks.life / 0.6,
            );
          }

          return this.life > 0;
        }

        destroy() {
          this.bolts.forEach((bolt) => scene.remove(bolt.group));
          scene.remove(this.light);
          if (this.sparkMesh) scene.remove(this.sparkMesh);
        }
      }

      // Chain Lightning
      class ChainLightning {
        constructor(start, targetList) {
          this.chains = [];
          this.life = 1;
          this.maxLife = 1;
          this.time = 0;

          let currentPos = start.clone();

          // Sort targets by distance from current position
          const remainingTargets = [...targetList];

          while (remainingTargets.length > 0) {
            // Find closest target
            let closestIdx = 0;
            let closestDist = Infinity;

            remainingTargets.forEach((t, idx) => {
              const dist = t.position.distanceTo(currentPos);
              if (dist < closestDist) {
                closestDist = dist;
                closestIdx = idx;
              }
            });

            const target = remainingTargets.splice(closestIdx, 1)[0];

            // Create chain
            const chain = new LightningChain(currentPos, target.position);
            this.chains.push(chain);

            currentPos = target.position.clone();

            // Highlight target
            target.material.emissive.setHex(0x4488ff);
            setTimeout(() => {
              target.material.emissive.setHex(0x112233);
            }, 300);

            if (remainingTargets.length === 0 || Math.random() > 0.8) break;
          }
        }

        update(delta) {
          this.life -= delta;
          this.time += delta;

          this.chains.forEach((chain) => chain.update(delta));

          return this.life > 0;
        }

        destroy() {
          this.chains.forEach((chain) => chain.destroy());
        }
      }

      class LightningChain {
        constructor(start, end) {
          this.start = start.clone();
          this.end = end.clone();
          this.bolts = [];
          this.time = 0;

          for (let i = 0; i < 2; i++) {
            const bolt = createLightningBolt(
              start,
              end,
              0.25 - i * 0.08,
              i === 0 ? 0xccddff : 0x6699ff,
              10,
              1.5,
            );
            this.bolts.push(bolt);
            scene.add(bolt.group);
          }

          this.light = new THREE.PointLight(0x88aaff, 5, 10);
          this.light.position.copy(end);
          scene.add(this.light);
        }

        update(delta) {
          this.time += delta;
          const flicker = Math.random() > 0.4 ? 1 : 0.5;

          this.bolts.forEach((bolt) => {
            bolt.material.uniforms.uTime.value = this.time;
            bolt.material.uniforms.uOpacity.value = flicker;
          });

          this.light.intensity = 5 * flicker;
        }

        destroy() {
          this.bolts.forEach((bolt) => scene.remove(bolt.group));
          scene.remove(this.light);
        }
      }

      // Nova
      class LightningNova {
        constructor(position) {
          this.position = position.clone();
          this.life = 0.8;
          this.maxLife = 0.8;
          this.time = 0;
          this.bolts = [];

          // Create circular expanding ring
          const boltCount = 24;
          for (let i = 0; i < boltCount; i++) {
            const angle = (i / boltCount) * Math.PI * 2;
            const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));

            const end = position.clone().add(dir.multiplyScalar(12));
            end.y = position.y;

            const bolt = createLightningBolt(
              position,
              end,
              0.2,
              0xaaccff,
              8,
              1.5,
            );
            this.bolts.push({
              group: bolt.group,
              material: bolt.material,
              direction: dir.clone(),
            });
            scene.add(bolt.group);
          }

          // Central light
          this.light = new THREE.PointLight(0x88bbff, 15, 20);
          this.light.position.copy(position);
          scene.add(this.light);
        }

        update(delta) {
          this.life -= delta;
          this.time += delta;

          const flicker = Math.random() > 0.2 ? 1 : 0.4;
          const progress = 1 - this.life / this.maxLife;

          this.bolts.forEach((bolt, idx) => {
            bolt.material.uniforms.uTime.value = this.time;
            bolt.material.uniforms.uOpacity.value =
              Math.max(0, 1 - progress * 1.5) * flicker;

            // Expand
            const scale = 1 + progress * 0.5;
            bolt.group.scale.setScalar(scale);
          });

          this.light.intensity = 15 * Math.max(0, 1 - progress * 1.5) * flicker;

          return this.life > 0;
        }

        destroy() {
          this.bolts.forEach((bolt) => scene.remove(bolt.group));
          scene.add(this.light);
        }
      }

      // Spell casting
      function castSpell(targetPos) {
        const startPos = new THREE.Vector3(0, 0, 8);

        showCombo();

        switch (currentSpell) {
          case "lightning":
            activeSpells.push(new LightningBolt(startPos, targetPos));
            break;
          case "chain":
            activeSpells.push(new ChainLightning(startPos, targets));
            break;
          case "nova":
            activeSpells.push(new LightningNova(startPos));
            break;
        }
      }

      function showCombo() {
        const combo = document.getElementById("combo-text");
        const names = {
          lightning: "LIGHTNING",
          chain: "CHAIN LIGHTNING",
          nova: "NOVA",
        };
        combo.textContent = names[currentSpell];
        combo.classList.remove("show");
        void combo.offsetWidth;
        combo.classList.add("show");
      }

      // Raycasting
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 2);

      function getTargetPosition(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const target = new THREE.Vector3();
        raycaster.ray.intersectPlane(groundPlane, target);
        return target;
      }

      renderer.domElement.addEventListener("click", (e) => {
        const target = getTargetPosition(e);
        if (target) {
          castSpell(target);
        }
      });

      // UI Events
      document.querySelectorAll(".spell-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          document
            .querySelectorAll(".spell-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentSpell = btn.dataset.spell;

          const names = {
            lightning: "Lightning",
            chain: "Chain Lightning",
            nova: "Nova",
          };
          document.getElementById("skill-name").textContent =
            names[currentSpell];
        });
      });

      document.getElementById("skill-orb").addEventListener("click", (e) => {
        e.stopPropagation();
        const target = new THREE.Vector3(
          (Math.random() - 0.5) * 10,
          0,
          -3 + (Math.random() - 0.5) * 10,
        );
        castSpell(target);
      });

      // Keyboard
      document.addEventListener("keydown", (e) => {
        if (e.key === "1")
          document.querySelector('[data-spell="lightning"]').click();
        if (e.key === "2")
          document.querySelector('[data-spell="chain"]').click();
        if (e.key === "3")
          document.querySelector('[data-spell="nova"]').click();
      });

      // Resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // Animation loop
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.1);
        const time = clock.getElapsedTime();

        // Update spells
        for (let i = activeSpells.length - 1; i >= 0; i--) {
          if (!activeSpells[i].update(delta)) {
            activeSpells[i].destroy();
            activeSpells.splice(i, 1);
          }
        }

        // Animate targets
        targets.forEach((target) => {
          target.position.y =
            target.userData.baseY +
            Math.sin(time * 2 + target.userData.offset) * 0.3;
          target.rotation.y = time;
        });

        composer.render();
      }

      animate();
    </script>
  </body>
</html>
