<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火球術 - 華麗版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+SC:wght@400;600&display=swap');
        
        :root {
            --bg: #050508;
            --fg: #f5f0e8;
            --accent: #ff4500;
            --accent-glow: #ff6b00;
            --card: rgba(10, 8, 15, 0.92);
            --border: rgba(255, 100, 0, 0.4);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #000;
            color: var(--fg);
            overflow: hidden;
            min-height: 100vh;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }
        
        .ui-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
            align-items: center;
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 35px;
            box-shadow: 0 0 30px rgba(255, 50, 0, 0.2);
        }
        
        .title-badge {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 6px;
            background: linear-gradient(to bottom, #fff, #ffaa88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 100, 0, 0.8);
            background-color: var(--card);
            padding: 12px 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 100, 0, 0.3);
        }
        
        .mode-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .mode-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #ff4500, #ff6b00);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
        }
        
        .cast-btn {
            padding: 16px 50px;
            border: none;
            background: linear-gradient(135deg, #b22222, #ff4500, #ff6b00);
            color: #fff;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            box-shadow: 0 0 25px rgba(255, 50, 0, 0.5);
            text-transform: uppercase;
            border: 1px solid rgba(255, 150, 100, 0.3);
        }
        
        .cast-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.8);
        }
        
        .cast-btn:active { transform: scale(0.95); }
        
        .cast-btn.cooldown {
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        
        .stats {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .stats span { color: #ffaa00; font-weight: bold; }
        
        @media (max-width: 768px) {
            .ui-panel { padding: 15px 20px; gap: 15px; flex-wrap: wrap; justify-content: center; }
            .title-badge { font-size: 20px; padding: 10px 25px; }
        }
    </style>
</head>
<body>
    <div class="title-badge">FIREBALL</div>
    <div class="vignette"></div>
    <div id="canvas-container"></div>
    
    <div class="ui-panel">
        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="single">火球术</button>
            <button class="mode-btn" data-mode="multi">多重投射</button>
        </div>
        <button class="cast-btn" id="castBtn">施法</button>
        <div class="stats">
            <div>施法次数: <span id="castCount">0</span></div>
            <div>粒子数量: <span id="particleCount">0</span></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // === 全局变量 ===
        let scene, camera, renderer, controls;
        let mage = null;
        let staffGemLight = null;
        let staffTipPos = new THREE.Vector3(0.6, 1.8, 0);
        let fireballs = [];
        let particles = [];
        let smokeParticles = [];
        let shockwaves = [];
        let castCount = 0;
        let currentMode = 'single';
        let clock = new THREE.Clock();
        
        // === 纹理生成 ===
        function generateTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            
            if (type === 'fire') {
                gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
                gradient.addColorStop(0.2, 'rgba(255, 180, 50, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 50, 0, 0.5)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            } else if (type === 'smoke') {
                gradient.addColorStop(0, 'rgba(50, 40, 30, 0.6)');
                gradient.addColorStop(0.5, 'rgba(30, 20, 15, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            } else { // glow
                gradient.addColorStop(0, 'rgba(255, 100, 0, 0.5)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        
        // === 初始化 ===
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);
            scene.fog = new THREE.FogExp2(0x050508, 0.02);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 14);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1.5, 0);
            controls.maxPolarAngle = Math.PI * 0.5;
            
            createLighting();
            createGround();
            createEnvironment();
            createMage();
            setupUI();
            
            window.addEventListener('resize', onResize);
            animate();
        }
        
        // === 灯光 ===
        function createLighting() {
            // 环境光
            scene.add(new THREE.AmbientLight(0x1a1020, 0.4));
            
            // 月光
            const moonLight = new THREE.DirectionalLight(0x4466aa, 0.3);
            moonLight.position.set(20, 30, 10);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 100;
            moonLight.shadow.camera.left = -30;
            moonLight.shadow.camera.right = 30;
            moonLight.shadow.camera.top = 30;
            moonLight.shadow.camera.bottom = -30;
            scene.add(moonLight);
        }
        
        // === 地面 ===
        function createGround() {
            const geo = new THREE.PlaneGeometry(100, 100, 50, 50);
            // 地形起伏
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = Math.sin(x*0.2) * 0.5 + Math.cos(y*0.2) * 0.5;
                pos.setZ(i, z);
            }
            geo.computeVertexNormals();
            
            const mat = new THREE.MeshStandardMaterial({
                color: 0x1a1510,
                roughness: 0.9,
                metalness: 0.1
            });
            
            const ground = new THREE.Mesh(geo, mat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }
        
        // === 环境 ===
        function createEnvironment() {
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x2a2520, roughness: 0.9 });
            
            // 随机岩石
            for(let i=0; i<15; i++) {
                const geo = new THREE.DodecahedronGeometry(Math.random() * 1.5 + 0.5, 0);
                // 随机变形
                const posArr = geo.attributes.position.array;
                for(let j=0; j<posArr.length; j+=3) {
                    posArr[j] += (Math.random() - 0.5) * 0.3;
                    posArr[j+1] += (Math.random() - 0.5) * 0.3;
                    posArr[j+2] += (Math.random() - 0.5) * 0.3;
                }
                geo.computeVertexNormals();
                
                const rock = new THREE.Mesh(geo, rockMat);
                const angle = Math.random() * Math.PI * 2;
                const dist = 8 + Math.random() * 15;
                rock.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
                rock.rotation.set(Math.random(), Math.random(), Math.random());
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }
        
        // === 法师 ===
        function createMage() {
            mage = new THREE.Group();
            
            // 身体
            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.5, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0515, roughness: 0.7 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.75;
            body.castShadow = true;
            mage.add(body);
            
            // 头
            const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xddb896, roughness: 0.6 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.7;
            head.castShadow = true;
            mage.add(head);
            
            // 帽子
            const hatGeo = new THREE.ConeGeometry(0.3, 0.5, 8);
            const hatMat = new THREE.MeshStandardMaterial({ color: 0x050308, roughness: 0.8 });
            const hat = new THREE.Mesh(hatGeo, hatMat);
            hat.position.set(0, 2.0, 0);
            mage.add(hat);
            
            // 法杖
            const staffGeo = new THREE.CylinderGeometry(0.03, 0.05, 2, 8);
            const staffMat = new THREE.MeshStandardMaterial({ color: 0x2a1a08, roughness: 0.6 });
            const staff = new THREE.Mesh(staffGeo, staffMat);
            staff.position.set(0.5, 1, 0);
            staff.rotation.z = -0.2;
            staff.castShadow = true;
            mage.add(staff);
            
            // 法杖宝石
            const gemGeo = new THREE.OctahedronGeometry(0.1, 0);
            const gemMat = new THREE.MeshStandardMaterial({
                color: 0xff6600,
                emissive: 0xff4400,
                emissiveIntensity: 2,
                roughness: 0.1
            });
            const gem = new THREE.Mesh(gemGeo, gemMat);
            gem.position.set(0.55, 1.95, 0);
            gem.name = 'gem';
            mage.add(gem);
            
            // 宝石光源
            staffGemLight = new THREE.PointLight(0xff5500, 2, 5);
            staffGemLight.position.copy(gem.position);
            mage.add(staffGemLight);
            
            scene.add(mage);
        }
        
        // === 施法冲击波 ===
        function createCastEffect(pos) {
            // 地面光圈
            const ringGeo = new THREE.RingGeometry(0.1, 0.2, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 1,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.set(pos.x, 0.05, pos.z);
            ring.rotation.x = -Math.PI/2;
            
            ring.userData = {
                type: 'ring',
                life: 1.0
            };
            scene.add(ring);
            shockwaves.push(ring);
        }
        
        // === 发射火球 ===
        function castFireball() {
            const btn = document.getElementById('castBtn');
            btn.classList.add('cooldown');
            setTimeout(() => btn.classList.remove('cooldown'), 400);
            
            const startPos = staffTipPos.clone();
            // 应用法师的变换
            if(mage) {
                startPos.applyMatrix4(mage.matrixWorld);
            }
            
            const dir = new THREE.Vector3(0, 0.1, -1);
            
            createCastEffect(startPos);
            
            if(currentMode === 'single') {
                createFireball(startPos, dir);
                castCount++;
            } else {
                const angles = [-0.25, -0.12, 0, 0.12, 0.25];
                angles.forEach(a => {
                    const newDir = dir.clone();
                    newDir.applyAxisAngle(new THREE.Vector3(0,1,0), a);
                    createFireball(startPos.clone(), newDir);
                });
                castCount++;
            }
            document.getElementById('castCount').textContent = castCount;
        }
        
        // === 创建火球 ===
        function createFireball(pos, dir) {
            const group = new THREE.Group();
            group.position.copy(pos);
            
            // 1. 核心 (白热)
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), coreMat);
            group.add(core);
            
            // 2. 内层火焰 (使用Shader实现动态纹理)
            const innerMat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    varying vec2 vUv;
                    void main() {
                        float glow = 0.5 + 0.5 * sin(uTime * 10.0 + vUv.x * 20.0);
                        vec3 col = mix(vec3(1.0, 0.8, 0.2), vec3(1.0, 0.3, 0.0), glow);
                        gl_FragColor = vec4(col, 0.8);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const inner = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), innerMat);
            group.add(inner);
            
            // 3. 外层光晕 (使用Sprite)
            const glowTex = generateTexture('glow');
            const glowMat = new THREE.SpriteMaterial({
                map: glowTex,
                color: 0xff5500,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.6
            });
            const glow = new THREE.Sprite(glowMat);
            glow.scale.set(1.5, 1.5, 1);
            group.add(glow);
            
            // 4. 动态点光源
            const light = new THREE.PointLight(0xff5500, 10, 15);
            light.castShadow = true; // 开启阴影
            light.shadow.mapSize.width = 512; // 降低阴影分辨率以节省性能
            light.shadow.mapSize.height = 512;
            group.add(light);
            
            group.userData = {
                velocity: dir.normalize().multiplyScalar(0.5),
                life: 3.0, // 秒
                innerMat: innerMat,
                light: light
            };
            
            scene.add(group);
            fireballs.push(group);
        }
        
        // === 创建尾迹粒子 ===
        function spawnTrailParticle(pos, isSmoke = false) {
            const tex = generateTexture(isSmoke ? 'smoke' : 'fire');
            const mat = new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                blending: isSmoke ? THREE.NormalBlending : THREE.AdditiveBlending,
                opacity: 1.0,
                depthWrite: false // 解决透明叠加问题
            });
            
            const sprite = new THREE.Sprite(mat);
            sprite.position.copy(pos);
            
            const size = isSmoke ? 1.0 : 0.4;
            sprite.scale.set(size, size, 1);
            
            sprite.userData = {
                type: isSmoke ? 'smoke' : 'fire',
                life: isSmoke ? 2.0 : 1.0,
                vel: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    isSmoke ? 0.02 : 0.01,
                    (Math.random() - 0.5) * 0.02
                )
            };
            
            scene.add(sprite);
            particles.push(sprite);
        }
        
        // === 设置UI ===
        function setupUI() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentMode = e.target.dataset.mode;
                });
            });
            
            document.getElementById('castBtn').addEventListener('click', castFireball);
            
            window.addEventListener('keydown', (e) => {
                if(e.code === 'Space') {
                    e.preventDefault();
                    castFireball();
                }
            });
        }
        
        // === 更新逻辑 ===
        function updateScene(dt) {
            const time = clock.getElapsedTime();
            
            // 更新火球
            for(let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                const d = fb.userData;
                
                fb.position.add(d.velocity);
                d.life -= dt;
                
                // 更新Shader
                if(d.innerMat.uniforms) {
                    d.innerMat.uniforms.uTime.value = time;
                }
                
                // 光源闪烁
                d.light.intensity = 8 + Math.sin(time * 20) * 2;
                
                // 生成尾迹
                if(Math.random() < 0.4) spawnTrailParticle(fb.position, false);
                if(Math.random() < 0.15) spawnTrailParticle(fb.position, true);
                
                // 移除
                if(d.life <= 0) {
                    scene.remove(fb);
                    fireballs.splice(i, 1);
                }
            }
            
            // 更新粒子
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                const d = p.userData;
                
                d.life -= dt;
                p.position.add(d.vel);
                
                // 上浮与衰减
                const ratio = 1 - (d.life / (d.type === 'smoke' ? 2.0 : 1.0));
                p.material.opacity = 1 - ratio;
                
                if(d.type === 'smoke') {
                    p.scale.x += dt * 0.5;
                    p.scale.y += dt * 0.5;
                } else {
                    p.scale.x -= dt * 0.2;
                    p.scale.y -= dt * 0.2;
                }
                
                if(d.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
            
            // 更新冲击波
            for(let i = shockwaves.length - 1; i >= 0; i--) {
                const s = shockwaves[i];
                s.userData.life -= dt * 2;
                
                if(s.userData.type === 'ring') {
                    s.scale.x += dt * 8;
                    s.scale.y += dt * 8;
                    s.material.opacity = s.userData.life;
                }
                
                if(s.userData.life <= 0) {
                    scene.remove(s);
                    shockwaves.splice(i, 1);
                }
            }
            
            // 法师宝石动画
            if(mage) {
                const gem = mage.getObjectByName('gem');
                if(gem) {
                    gem.rotation.y = time * 2;
                    gem.rotation.x = Math.sin(time * 3) * 0.2;
                    staffGemLight.intensity = 1 + Math.sin(time * 5) * 0.5;
                }
                // 轻微漂浮
                mage.position.y = Math.sin(time * 1.5) * 0.05;
            }
            
            document.getElementById('particleCount').textContent = particles.length;
        }
        
        // === 窗口调整 ===
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // === 动画循环 ===
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1); // 防止卡顿导致的巨大位移
            
            controls.update();
            updateScene(dt);
            renderer.render(scene, camera);
        }
        
        // 启动
        init();
    </script>
</body>
</html>
